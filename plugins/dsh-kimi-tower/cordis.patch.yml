# dsh-kimi-tower — bundle patch.
#
# Mounts the tower-mode plugin (one Host row). All protocol state lives inside
# the target repository under `.tower/`, so the row itself needs no config.
- insert:
    - id: kimi-tower
      name: dsh-kimi-tower
      config:
        # The main agent of a workspace may enter tower mode with `tower_activate` instead of waiting for a person to type
        # `/tower on`. Profiles that want tower to stay a human decision remove this line.
        agentCanEnable: true
